
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refúgio de Criaturas Mágicas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Refúgio de Criaturas Mágicas</h1>
        <p>Sistema de adoção por patrocinador</p>
    </header>

    <main>
        <h2>Solicitar Adoção</h2>

        <label>Nome do patrocinador:</label>
        <input type="text" id="patrocinador" placeholder="Digite seu nome">

        <label>Escolha uma criatura:</label>
        <select id="criatura">
            <option value="">Selecione uma criatura</option>
            <option value="disponivel">Dragão Azul</option>
            <option value="disponivel">Fênix Dourada</option>
            <option value="indisponivel">Grifo Sombrio</option>
        </select>

        <label class="check">
            <input type="checkbox" id="pendencia">
            Possuo pendências no refúgio
        </label>

        <label>Decisão do guardião:</label>
        <select id="guardiao">
            <option value="">Aguardando decisão</option>
            <option value="sim">Autorizar adoção</option>
            <option value="nao">Recusar adoção</option>
        </select>

        <button onclick="processarAdocao()">Solicitar Adoção</button>

        <div id="resultado"></div>
    </main>

    <footer>
        <p>Projeto de APS - 2º Informática</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
